# Synthetic fix list: a decision of the finding verifier and a finding of the roaster, as the parent
# run's journal holds them, and the spec the parent run checked. The verify stage ran twice, and only
# its last result counts.
run: wf_parent-run
spec: tests/fixtures/fix-list/parent.yaml
entries:
  - source: verify:1
    decision:
      sourceIds:
        - correctness:1
      action: needs-decision
      severity: must-fix
      reason: "The specified error is\n  swallowed by the catch block."
      evidence: src/example.js:12 catches the error.
      authority: No recorded words of the user say how the error reaches the caller.
      correction: ""
      constraints: ""
      acceptance: ""
      removal: false
      receipts:
        - file: src/example.js
          line: 12
          quote: "catch (error) {}"
  - source: roaster:0
    finding:
      file: src/reader.js
      claim: The file handle stays open when the read fails.
      severity: must-fix
      lane: fixer-actionable
      receipts:
        - file: src/reader.js
          line: 20
          quote: open(path)
