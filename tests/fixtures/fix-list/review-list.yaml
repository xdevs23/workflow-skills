# Synthetic fix list of a review pass: the findings of its review seats, and no spec, because the
# change it reviewed was made without one.
run: wf_review-pass
spec: null
entries:
  - source: review:correctness:0
    finding:
      file: src/example.js
      claim: The error is swallowed.
      severity: must-fix
      lane: fixer-actionable
      receipts:
        - file: src/example.js
          line: 12
          quote: 'catch (error) {}'
  - source: review:rules:0
    finding:
      file: src/example.js
      claim: The handler logs with console.log, which the project rules forbid.
      severity: should-fix
      lane: fixer-actionable
      scope: in-change
      receipts:
        - file: src/example.js
          line: 31
          quote: console.log(event)
