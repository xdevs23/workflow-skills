unit: example-export
entries:
  - id: export-request
    file: session.jsonl
    line: 1
    uuid: request-string
    words: Export the selected rows.
    context:
      - { file: session.jsonl, line: 2, uuid: request-blocks, quote: Export the selected rows. }
  - id: stream-choice
    file: session.jsonl
    line: 9
    uuid: answer
    words: Stream the rows.
    context:
      - { file: session.jsonl, line: 6, uuid: question-turn, quote: 'Should the export stream or batch?' }
      - { file: session.jsonl, line: 8, uuid: offer, quote: 'Two shapes: (a) stream the rows, (b) batch them.' }
    answers: Which one?
    approves: (a) stream the rows
  - id: interface
    file: session.jsonl
    line: 11
    uuid: dialog-answer
    words: Stream, in input order
    context:
      - { file: session.jsonl, line: 10, uuid: dialog-call, quote: One question. }
    answers: Which interface should the export use?
  - id: schedule
    file: session.jsonl
    line: 15
    uuid: dialog-answer-blocks
    words: Nightly, after the backup
    context:
      - { file: session.jsonl, line: 14, uuid: dialog-call-blocks, quote: How often should the export run? }
  - id: columns
    file: session.jsonl
    line: 34
    uuid: note-answer
    words: Keep the ids, drop the audit columns
    context:
      - { file: session.jsonl, line: 33, uuid: columns-call, quote: Which columns should the export keep? }
    answers: Which columns should the export keep?
  - id: skip-empty
    file: session.jsonl
    line: 20
    uuid: queued-human
    words: Skip the empty rows.
    context:
      - { file: session.jsonl, line: 18, uuid: queue-turn, quote: Start the export. }
    answers: Should the export skip empty rows?
  - id: monthly-report
    file: session.jsonl
    line: 29
    uuid: approval
    words: Approved, go ahead.
    context:
      - { file: session.jsonl, line: 24, uuid: report-turn, quote: Plan the monthly report. }
    approves: group the rows by month and total each month
  - id: monthly-plan
    file: session.jsonl
    line: 29
    uuid: approval
    words: Approved, go ahead.
    context:
      - { file: session.jsonl, line: 25, uuid: report-offer, quote: The whole plan is in tests/fixtures/spec-provenance/plan.html. }
    approves:
      text: Leave rows without a date out of every total.
      file: tests/fixtures/spec-provenance/plan.html
      sha256: c299a2f725e6a2f27884c8961220bb4307f909718a415db076b3d74a34aba5dc
