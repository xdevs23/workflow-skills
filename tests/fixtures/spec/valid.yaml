# Synthetic discussion: user entries from every kind of record the tool reads as the user's words,
# and assistant entries quoting a text block, the question text of a dialog call and a Write call.
unit: example-export
entries:
  - { file: session.jsonl, line: 1, uuid: request-string, author: user, text: Export the selected rows. }
  - { file: session.jsonl, line: 8, uuid: offer, author: assistant, text: 'Two shapes: (a) stream the rows, (b) batch them. Which one?' }
  - { file: session.jsonl, line: 9, uuid: answer, author: user, text: Stream the rows. }
  - { file: session.jsonl, line: 10, uuid: dialog-call, author: assistant, text: Which interface should the export use? }
  - { file: session.jsonl, line: 11, uuid: dialog-answer, author: user, text: 'Stream, in input order' }
  - { file: session.jsonl, line: 20, uuid: queued-human, author: user, text: Skip the empty rows. }
  - { file: session.jsonl, line: 34, uuid: note-answer, author: user, text: 'Keep the ids, drop the audit columns' }
  - { file: session.jsonl, line: 44, uuid: plan-write, author: assistant, text: Leave rows without a date out of every total. }
  - { file: session.jsonl, line: 46, uuid: plan-approval, author: user, text: 'Yes, build it.' }
